services:
  websocket-server:
    build:
      context: ./WebSocketServer
      dockerfile: Dockerfile
    ports:
      - "5057:5057"
    environment:
      - ASPNETCORE_URLS=http://+:5057
      - ASPNETCORE_ENVIRONMENT=Development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5057/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  mysql:
    image: mysql:latest
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql




  frontend:
    build:
      context: ./WebApp/h5-webapp-pwa
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      websocket-server:
        condition: service_healthy
volumes:
  mysql_data: